# dsh-imagegen bundle patch。
# 只做 insert，纯文本、无需构建。config 可选项见 index.js 的 Config：
#   provider        dashscope（默认）| openai
#   baseURL         默认 https://dashscope.aliyuncs.com
#   model           默认 qwen-image-3.0
#   apiKeyEnv       环境变量名，默认 DASHSCOPE_API_KEY
#   apiKey          直接写密钥（不推荐）
#   credentialsFile DSH 凭据文件（默认 $DSH_HOME/.credentials.yaml）
#   credentialsKey  从凭据文件读哪个键（默认 MULTIMODAL_GENERATION_API_KEY）
#   outputDir       图片落盘目录（默认 $DSH_HOME/imagegen）
#   timeoutMs       单次生成超时（默认 180000）
- insert:
    - id: 'dsh-imagegen'
      name: 'dsh-imagegen'
      config:
        provider: dashscope
        model: qwen-image-3.0
